version: '3.8'

x-common-service: &common-service
  build:
    context: .
    dockerfile: Dockerfile
  networks:
    - hermes-network

x-business-service: &business-service
  <<: *common-service
  ports:
    - "0:8080"
  depends_on:
    config-server:
      condition: service_healthy

services:
  # Infrastructure Services
  config-server:
    <<: *common-service
    build:
      args:
        SERVICE_NAME: config-server
        SERVER_PORT: 8888
        SPRING_CONFIG_IMPORT: ""
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8888/actuator/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
      start_interval: 5s

  discovery-server:
    <<: *common-service
    build:
      args:
        SERVICE_NAME: discovery-server
        SERVER_PORT: 8761
        SPRING_CONFIG_IMPORT: ""
    ports:
      - "8761:8761"

  gateway-server:
    <<: *business-service
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: gateway-server
    ports:
      - "80:8080"

  # Business Services
  user-service:
    <<: *business-service
    build:
      args:
        SERVICE_NAME: user-service

  org-service:
    <<: *business-service
    build:
      args:
        SERVICE_NAME: org-service

  attendance-service:
    <<: *business-service
    build:
      args:
        SERVICE_NAME: attendance-service

  approval-service:
    <<: *business-service
    build:
      args:
        SERVICE_NAME: approval-service

  communication-service:
    <<: *business-service
    build:
      args:
        SERVICE_NAME: communication-service

  attachment-service:
    <<: *business-service
    build:
      args:
        SERVICE_NAME: attachment-service

  companyinfo-service:
    <<: *business-service
    build:
      args:
        SERVICE_NAME: companyinfo-service

  news-crawler-service:
    <<: *business-service
    build:
      args:
        SERVICE_NAME: news-crawler-service

  # External Dependencies
  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: myuser
      RABBITMQ_DEFAULT_PASS: mypassword
    ports:
      - "5672:5672"
      - "15672:15672"  # Management UI
    networks:
      - hermes-network

networks:
  hermes-network:
    driver: bridge
