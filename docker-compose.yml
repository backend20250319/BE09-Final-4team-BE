version: '3.8'

services:
  # Infrastructure Services
  config-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: config-server
        SERVER_PORT: 8888
        SPRING_CONFIG_IMPORT: ""
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8888/actuator/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
      start_interval: 5s
    networks:
      - hermes-network

  discovery-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: discovery-server
        SERVER_PORT: 8761
        SPRING_CONFIG_IMPORT: ""
    ports:
      - "8761:8761"
    networks:
      - hermes-network

  gateway-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: gateway-server
    ports:
      - "80:8080"
    depends_on:
      config-server:
        condition: service_healthy
    networks:
      - hermes-network

  # Business Services (Random Ports)
  approval-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: approval-service
    ports:
      - "0:8080"  # Random external port
    depends_on:
      config-server:
        condition: service_healthy
    networks:
      - hermes-network

  attendance-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: attendance-service
    ports:
      - "0:8080"  # Random external port
    depends_on:
      config-server:
        condition: service_healthy
    networks:
      - hermes-network

  user-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: user-service
    ports:
      - "0:8080"  # Random external port
    depends_on:
      config-server:
        condition: service_healthy
    networks:
      - hermes-network

  # Add more services as needed...

  # External Dependencies
  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: myuser
      RABBITMQ_DEFAULT_PASS: mypassword
    ports:
      - "5672:5672"
      - "15672:15672"  # Management UI
    networks:
      - hermes-network

networks:
  hermes-network:
    driver: bridge

volumes:
  postgres_data: